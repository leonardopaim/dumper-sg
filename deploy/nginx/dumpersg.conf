# Included by C:/nginx/conf/sites-enabled/*.conf inside the http block.
# Keep both listeners local: this application stores database credentials.
server {
    listen 127.0.0.1:8788;
    server_name localhost 127.0.0.1;

    # Reject other Host values before forwarding with the backend's Host.
    if ($http_host !~* "^(127\.0\.0\.1|localhost):8788$") {
        return 403;
    }

    access_log logs/dumpersg-access.log;
    error_log logs/dumpersg-error.log;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8787;
        proxy_set_header Connection "";
        # Forward Origin unchanged; the application allows the two exact URLs.
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_buffering off;
    }
}
